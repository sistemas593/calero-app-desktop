spring.datasource.url=jdbc:postgresql://localhost:5432/lili
spring.datasource.username=postgres
spring.datasource.password=samy

spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

server.port=8080

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

#spring.jpa.show-sql=true

spring.jackson.deserialization.fail-on-numbers-for-enums=true

app.origen=LOC

# Secreto (whsec_...) del webhook de Resend, ver https://resend.com/webhooks
# En local se puede probar con ngrok: https://resend.com/docs/dashboard/webhooks/introduction
resend.webhook.secret=${RESEND_WEBHOOK_SECRET:}

